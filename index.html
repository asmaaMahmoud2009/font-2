<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="مولد مقولات تفاعلي - Quote Generator"
  >

  <title>Quote Generator | مولد المقولات</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <section class="quote-card" aria-labelledby="page-title">

      <!-- علامة الاقتباس -->
      <div class="quote-icon" aria-hidden="true">
        “
      </div>

      <!-- عنوان الصفحة -->
      <h1 id="page-title">
        مولد المقولات
      </h1>

      <p class="subtitle">
        مقولة جديدة في كل مرة 
      </p>

      <!-- مكان عرض المقولة -->
      <div class="quote-box">

        <p id="quote" class="quote-text">
          اضغط على الزر للحصول على مقولة جديدة.
        </p>

        <p id="author" class="author">
          —
        </p>

      </div>

      <!-- الأزرار -->
      <div class="actions">

        <button
          id="newQuoteBtn"
          class="btn primary"
          type="button"
        >
          مقولة جديدة
        </button>

        <button
          id="copyBtn"
          class="btn secondary"
          type="button"
        >
          نسخ المقولة
        </button>

      </div>

      <!-- رسالة النسخ -->
      <p
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></p>

    </section>

  </main>

  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
